<div class="container mt-5">
    <div style="text-align:center">
        @if(!registerMode){
            <h1>Hello User</h1>
            <p class="lead">Welcome to my portfolio site!</p>
            <div class="text-center">
                <button (click)="registertoggle()" class="btn btn-primary btn-lg me-2">Register</button>
                <button class="btn btn-info btn-lg me-2">Learn More</button>
            </div>
        }
        @else {
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-4">
                        <app-register 
                            [usersFromHomeComponet]="users"
                            (cancelRegister)="cancelRegisterMode($event)"
                        ></app-register>
                    </div>
                </div>
                
            </div>
        }
    </div>
<div class="panel-list">
  <div class="panel" *ngFor="let project of projects">
    
    <app-chess-host></app-chess-host>
  </div>
</div>

</div>
