
@if (showForm) {
  <div class="game-config-wrapper">
    @if (showForm) {
      <form class="game-card" [formGroup]="form" (ngSubmit)="submit()">
        <p>Configure Game</p>
        <label>
          Apponent:
          <input type="radio" value="computer" formControlName="player"> Computer
          <input type="radio" value="human" formControlName="player"> Human
        </label><br>
        <div class="form-group">
          <label class="label">
            Seach Depth:
          </label>
          <input type="number" formControlName="searchDepth" min="1" max="3" class="input">
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
          Create Game
        </button>
      </form>
    }
  </div>
}
@if (!showForm) {
  <ng-container *ngComponentOutlet="current; inputs: dynamicInputs"></ng-container>
}
