name: Build and deploy .NET + Angular to Azure Web App

on:
  push:
    branches:
      - master    # change to 'main' if your repo uses main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Build Angular
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build Angular client
        working-directory: ./client
        run: |
          npm ci
          npm run build -- --configuration production

      # 2) Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3) Copy Angular build into API wwwroot (robust handling of dist layout)
      - name: Copy Angular build into API wwwroot
        run: |
          API_PROJECT_PATH="./ProjectDemoWebsite/API"
          CLIENT_DIST_BASE="./client/dist"
          echo "Inspecting $CLIENT_DIST_BASE"
          if [ ! -d "$CLIENT_DIST_BASE" ]; then
            echo "ERROR: Angular dist directory not found at $CLIENT_DIST_BASE"
            ls -la ./client || true
            exit 1
          fi

          # Prefer the exact folder dist/client (from angular.json). If not present, pick a sensible fallback.
          if [ -d "$CLIENT_DIST_BASE/client" ]; then
            SRC="$CLIENT_DIST_BASE/client"
          else
            # If dist contains files directly (no subfolder), use that
            if [ "$(ls -A $CLIENT_DIST_BASE)" ]; then
              # If there are files (index.html etc.) right inside dist, use dist itself
              if ls "$CLIENT_DIST_BASE" | grep -q "index.html"; then
                SRC="$CLIENT_DIST_BASE"
              else
                # Otherwise pick the first subdirectory inside dist
                FIRST_SUBDIR=$(find "$CLIENT_DIST_BASE" -maxdepth 1 -mindepth 1 -type d | head -n 1)
                if [ -n "$FIRST_SUBDIR" ]; then
                  SRC="$FIRST_SUBDIR"
                else
                  echo "ERROR: Could not find built client files under $CLIENT_DIST_BASE"
                  ls -la "$CLIENT_DIST_BASE"
                  exit 1
                fi
              fi
            fi
          fi

          echo "Copying client build from $SRC to $API_PROJECT_PATH/wwwroot"
          rm -rf "$API_PROJECT_PATH/wwwroot" || true
          mkdir -p "$API_PROJECT_PATH/wwwroot"
          cp -r "$SRC/"* "$API_PROJECT_PATH/wwwroot/"

          echo "wwwroot contents:"
          ls -la "$API_PROJECT_PATH/wwwroot"

      # 4) Publish .NET app (auto-detect csproj inside API_PROJECT_PATH)
      - name: Publish .NET app
        run: |
          API_PROJECT_PATH="./ProjectDemoWebsite/API"
          CSPROJ=$(ls "$API_PROJECT_PATH"/*.csproj 2>/dev/null | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "ERROR: No .csproj found in $API_PROJECT_PATH"
            ls -la "$API_PROJECT_PATH" || true
            exit 1
          fi
          echo "Publishing $CSPROJ"
          dotnet publish "$CSPROJ" -c Release -o ./publish

      # 5) Deploy to Azure Web App
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16BC7C445BBF45DCA6259DEB7E2B942B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8F006D3FD20149A7B4EE047E0BFB5F0C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BEC55C1C4CD847D8A0D69082AACEE1C4 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Todd-Portfolio'
          package: './publish'







