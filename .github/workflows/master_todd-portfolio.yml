name: Build and deploy .NET + Angular to Azure Web App

on:
  push:
    branches:
      - master    # change to 'main' if your repo uses main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: DEBUG – show repo structure
        run: |
          echo "===== ROOT ====="
            ls -la

            echo "===== ProjectDemoWebsite ====="
            ls -la ProjectDemoWebsite || true

            echo "===== find csproj ====="
            find . -name "*.csproj"
      # 1) Build Angular
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build Angular client
        working-directory: ./client
        run: |
          npm ci
          npm run build -- --configuration production

      # 2) Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3) Copy Angular build into API wwwroot (FIXED PATH)
      - name: Copy Angular build into API wwwroot
        run: |
          API_PROJECT_PATH="./API"
          # Point directly to where index.html and assets are located
          SRC="./client/dist/client/browser" 

          echo "Copying client build from $SRC to $API_PROJECT_PATH/wwwroot"
          if [ ! -d "$SRC" ]; then
            echo "ERROR: Angular browser directory not found at $SRC"
            exit 1
          fi
          
          rm -rf "$API_PROJECT_PATH/wwwroot" || true
          mkdir -p "$API_PROJECT_PATH/wwwroot"
          cp -r "$SRC/"* "$API_PROJECT_PATH/wwwroot/"

          echo "wwwroot contents:"
          ls -la "$API_PROJECT_PATH/wwwroot"

      # 4) Publish .NET app (auto-detect csproj inside API_PROJECT_PATH)
      - name: Publish .NET app
        run: |
          API_PROJECT_PATH="./API"
          CSPROJ=$(ls "$API_PROJECT_PATH"/*.csproj 2>/dev/null | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "ERROR: No .csproj found in $API_PROJECT_PATH"
            ls -la "$API_PROJECT_PATH" || true
            exit 1
          fi
          echo "Publishing $CSPROJ"
          dotnet publish "$CSPROJ" -c Release -o ./publish

      # 5) Deploy to Azure Web App
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Portfolio-Frontend-API'
          slot-name: 'Production'
          package: ./publish
          
